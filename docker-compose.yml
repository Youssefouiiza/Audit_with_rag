version: "3.9"

# ─────────────────────────────────────────────
#  Audit Platform — Infrastructure Services
# ─────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: audit-postgres
    environment:
      POSTGRES_DB:       audit_platform
      POSTGRES_USER:     audit
      POSTGRES_PASSWORD: audit_secret
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d audit_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── RabbitMQ (Messaging / JMS) ───────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: audit-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"    # AMQP protocol port (Spring AMQP connects here)
      - "15672:15672"  # Management UI → http://localhost:15672  (guest/guest)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── MinIO (Object Storage) ───────────────────
  minio:
    image: minio/minio:latest
    container_name: audit-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3-compatible API
      - "9001:9001"   # Web console → http://localhost:9001
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
