name: SonarCloud analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  Analysis:
    runs-on: ubuntu-latest

    steps:
      # 0. Checkout code
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      # 1. Setup Java & Run Backend Tests
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run Backend Tests
        run: mvn -B test
        working-directory: ./backend
        continue-on-error: true

      # 2. Setup Node.js & Run Frontend Tests
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: ./frontend
      - name: Run Frontend Tests
        run: npm run test:coverage
        working-directory: ./frontend
        continue-on-error: true

      # 3. Setup Python & Run RAG Tests
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt
        working-directory: ./audit_rag_maroc
      - name: Run Python Tests
        run: pytest
        working-directory: ./audit_rag_maroc
        continue-on-error: true

      # 4. Run SonarCloud Scanner
      - name: Analyze with SonarCloud
        uses: SonarSource/sonarcloud-github-action@4006f663ecaf1f8093e8e4abb9227f6041f52216
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Youssefouiiza_New_audit 
            -Dsonar.organization=youssefouiiza
          projectBaseDir: .
