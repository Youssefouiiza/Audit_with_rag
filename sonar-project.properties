sonar.projectKey=audit-platform
sonar.organization=youssefouiiza
sonar.projectName=Audit Platform
sonar.sources=backend/src/main,frontend/src
sonar.java.binaries=backend/target/classes
sonar.exclusions=**/node_modules/**,**/target/**,**/dist/**,**/.next/**
sonar.sourceEncoding=UTF-8

# Coverage Reporting Paths
sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.python.coverage.reportPaths=audit_rag_maroc/coverage.xml
